openapi: 3.1.0
info:
  title: User Apis
  version: 1.0.0
  description: API for managing user information.

paths:

  /auth/register:
    post:
      summary: Self-signup registration (public)
      description: >
        Creates a user without any role assignment: a public endpoint can't grant roles or bank access. Until a role
        is assigned (profiler-service, POST /role-assignments), login issues a CUSTOMER token without tenant, which
        can't access bank data.
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDTO'
      responses:
        '201':
          description: User created
        '400':
          description: Invalid input
        '409':
          description: Email already registered

  /auth/login:
    post:
      summary: User login (public)
      description: >
        Authenticates the user and issues a JWT for one active role assignment. The token carries the
        tenantId (bank code) and branchCode claims of that role assignment, and only the roles held in it.
        Without branchCode the user's first role assignment is used.
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentialsDTO'
      responses:
        '200':
          description: Login succeeded; returns JWT auth response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '401':
          description: Invalid credentials
        '403':
          description: The user has no role assignment in the requested branch

  /auth/switch-branch:
    post:
      summary: Switch the active branch
      description: >
        Issues a new JWT for another role assignment of the current user (possibly in another bank) and revokes
        the current token. The client must replace its token with the returned one.
      operationId: switchBranch
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchBranchRequestDTO'
      responses:
        '200':
          description: New JWT for the requested branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: The user has no role assignment in the requested branch

  /auth/logout:
    post:
      summary: Invalidate current JWT (logout)
      operationId: logoutUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token revoked (client should discard it)
        '401':
          description: Unauthorized

  /me:
    get:
      summary: Get current logged-in user info
      operationId: getCurrentUser
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized

  /user/lookup:
    get:
      summary: Find one user by exact email
      description: >
        Case-insensitive exact match on the whole email. Scoped: an ADVISOR finds users with a role assignment in the
        bank and branch of its token; a BANK_ADMIN users with one in its bank, plus users not linked to any bank; a
        PLATFORM_ADMIN anyone. A user outside the caller's scope answers 404, like an unknown email, so the existence
        of an account isn't revealed. roleAssignments lists only the assignments the caller may see.
      operationId: lookupUserByEmail
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryDTO'
        '400':
          description: Missing or blank email (REQUEST_VALIDATION_ERROR)
        '403':
          description: The caller's role can't look users up (CUSTOMER)
        '404':
          description: No such user in the caller's scope (OBJECT_NOT_FOUND)

  /user/search:
    get:
      summary: Search users by email or name (admins)
      description: >
        Case-insensitive "contains" on email, first name and last name (at least 3 characters), paged (page, size) and
        sorted by email. Scoped like /user/lookup: a BANK_ADMIN sees users with a role assignment in its bank plus
        unlinked users; a PLATFORM_ADMIN everyone. linked=false lists only users with no role assignment (to link
        new customers), linked=true only users with one in the caller's scope. Page size 1 to 50 (default 20).
      operationId: searchUsers
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: linked
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Zero-based page number
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryPageDTO'
        '400':
          description: Query shorter than 3 characters (REQUEST_VALIDATION_ERROR)
        '403':
          description: Only BANK_ADMIN and PLATFORM_ADMIN can search

  /user/{id}:
    get:
      summary: Get user by ID
      description: >
        A user can read itself; staff only users in their scope (same rule as /user/lookup). Outside the scope the
        answer is 404, like an unknown id.
      operationId: getUserById
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: User not found
    put:
      summary: Update user by ID
      operationId: updateUserById
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: User not found
        '400':
          description: Invalid input

  /user:
    post:
      summary: Create a new user (administrative)
      description: Administrative creation; requires appropriate role (e.g. ROLE_ADMIN).
      operationId: createUser
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Invalid input
        '403':
          description: Forbidden

  /user/{id}/disable:
    post:
      summary: Disable a user
      operationId: disableUser
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User disabled
        '404':
          description: User not found
        '403':
          description: Forbidden

  /user/{id}/enable:
    post:
      summary: Enable a user
      operationId: enableUser
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User enabled
        '404':
          description: User not found
        '403':
          description: Forbidden


  /auth/password/setup:
    post:
      summary: Initial password setup after registration (public)
      description: >
        Sets the first password, authorized by the password-setup token from the onboarding link
        (Authorization: Bearer setup token). The link works once: its token is consumed on the first successful call.
        Error bodies use the platform ErrorResponse (errorCode, category, errorMessage, traceId).
      operationId: setupPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupPasswordDTO'
      responses:
        '202':
          description: Password set successfully
        '400':
          description: >
            The password violates the password policy (errorCode REQUEST_VALIDATION_ERROR, errorMessage lists the
            violated rules). The link is not consumed, so the user can retry.
        '401':
          description: >
            The link can't be used: the setup token is expired, already used, malformed, or not a password-setup
            token (errorCode PASSWORD_SETUP_TOKEN_INVALID). An expired or badly signed token is rejected before the
            endpoint, with an empty body.
        '503':
          description: >
            The token store can't be reached (errorCode TOKEN_STORE_UNAVAILABLE). Nothing was changed; retry later.

  /auth/password/reset:
    post:
      summary: Request password reset (public)
      operationId: requestPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestDTO'
      responses:
        '200':
          description: Password reset email sent if account exists
        '400':
          description: Invalid input

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginCredentialsDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        bankCode:
          type: string
          description: Optional bank of the role assignment to log in to; needed only if the branch code exists in several banks
        branchCode:
          type: string
          description: Optional branch to log in to; defaults to the user's first role assignment

    SwitchBranchRequestDTO:
      type: object
      required:
        - branchCode
      properties:
        bankCode:
          type: string
          description: Optional bank of the role assignment; needed only if the branch code exists in several banks
        branchCode:
          type: string
          description: Branch of one of the current user's role assignments

    RegisterRequestDTO:
      type: object
      required:
        - email
        - firstName
        - lastName
        - phoneNumber
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string

    SetupPasswordDTO:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: "New password (apply server-side validation rules)"

    PasswordResetRequestDTO:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmDTO:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: "Password reset token sent to user's email"
        password:
          type: string
          description: "New password (apply server-side validation rules)"

    AuthResponseDTO:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64

    UserDTO:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        country:
          type: string
        city:
          type: string
        address:
          type: string
        gender:
          type: string
        birthDate:
          type: string
        userBranchRoles:
          type: array
          readOnly: true
          description: >
            Role assignments of the user (bank, branch, role). Ignored on create and update: they are managed in
            profiler-service (POST/DELETE /role-assignments).
          items:
            $ref: '#/components/schemas/UserBranchRoleDTO'
        userSettings:
          $ref: '#/components/schemas/UserSettingsDTO'

    UserBranchRoleDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Role assignment id in profiler-service (DELETE /role-assignments/{id} revokes it)
        bankCode:
          type: string
        branchCode:
          type: string
        active:
          type: boolean
          readOnly: true
          description: >
            True for the role assignment the current token was issued for (its tenantId/branchCode).
            Use this role assignment's role for UI decisions; switch with POST /auth/switch-branch.
        role:
          type: string

    UserSettingsDTO:
      type: object
      properties:
        language:
          type: string
        theme:
          type: string

    UserSummaryDTO:
      type: object
      description: Enough to find and link a user; not a profile (no phone, address or birth date)
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roleAssignments:
          type: array
          description: The user's role assignments the caller may see; empty when unlinked or none in the caller's scope
          items:
            $ref: '#/components/schemas/UserBranchRoleDTO'

    UserSummaryPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserSummaryDTO'
        page:
          type: integer
          description: Zero-based page number
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
