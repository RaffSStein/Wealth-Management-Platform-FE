openapi: 3.1.0
info:
  title: Bank Apis
  version: 1.0.0
  description: API for managing bank information.

paths:
  /bank/banks:
    get:
      tags:
        - Bank
      summary: List the banks
      description: >-
        One entry per bank, sorted by bank code. A PLATFORM_ADMIN sees every bank; any other role only the bank of its
        token; a token without a bank sees none.
      operationId: getBanks
      responses:
        '200':
          description: Banks visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankDto'

  /bank/branches:
    post:
      tags:
        - Bank
      summary: Create a new bank branch
      operationId: createBankBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankBranchDto'
      responses:
        '201':
          description: Bank branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankBranchDto'
        '400':
          description: Invalid input
    get:
      tags:
        - Bank
      summary: Get bank branches (paged & optionally filtered)
      description: >-
        Returns a paged list of bank branches. Optional query parameters allow filtering
        by multiple attributes. Filters are combined with logical AND. Pagination is zero-based.
        Scoped: a PLATFORM_ADMIN searches every bank; any other role only the bank of its token, whatever bankCode it
        sends.
      operationId: getBankBranches
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (1 to 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: "Sorting criteria: property,asc|desc (e.g. branchCode,asc). Repeat for several criteria."
          schema:
            type: string
          example: "branchCode,asc"
        - name: status
          in: query
          required: false
          description: Exact status filter (e.g. ACTIVE, the branches roles can be assigned in).
          schema:
            type: string
          example: "ACTIVE"
        - name: bankCode
          in: query
          required: false
          schema:
            type: string
          description: Exact bank code filter.
          example: "B001"
        - name: bankName
          in: query
          required: false
          schema:
            type: string
          description: Bank name.
          example: "International Bank"
        - name: branchCode
          in: query
          required: false
          schema:
            type: string
          description: Exact branch code filter.
          example: "BR123"
        - name: swiftCode
          in: query
          required: false
          schema:
            type: string
          description: SWIFT code filter.
          example: "INTLUS33"
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
          example: "US"
        - name: bankType
          in: query
          required: false
          schema:
            type: string
          description: Bank type/category filter.
          example: "RETAIL"
        - name: branchCity
          in: query
          required: false
          schema:
            type: string
          description: City where the branch is located (partial or exact depending on implementation).
          example: "New York"
        - name: zipCode
          in: query
          required: false
          schema:
            type: string
          description: Postal/ZIP code filter.
          example: "10001"
      responses:
        '200':
          description: Paged list of bank branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBankBranchDto'
        '400':
          description: Invalid filter combination or parameter format

  /bank/{bankCode}/branches/{branchCode}:
    get:
      tags:
        - Bank
      summary: Get a branch of a bank
      description: >
        Branch codes are unique only within a bank, so a branch is identified by bank code and branch code.
        Used by profiler-service to validate role assignments. A non-platform caller only finds branches of the bank
        of its token (another bank answers 404).
      operationId: getBankBranchOfBank
      parameters:
        - name: bankCode
          in: path
          required: true
          schema:
            type: string
        - name: branchCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank branch found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankBranchDto'
        '404':
          description: No branch with this code in this bank
  /bank/branches/{branchCode}:
    get:
      tags:
        - Bank
      summary: Get a bank branch by branchCode
      operationId: getBankBranchByCode
      parameters:
        - name: branchCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank branch found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankBranchDto'
        '404':
          description: Bank branch not found
    put:
      tags:
        - Bank
      summary: Update a bank branch by branchCode
      operationId: updateBankBranch
      parameters:
        - name: branchCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankBranchDto'
      responses:
        '200':
          description: Bank branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankBranchDto'
        '404':
          description: Bank branch not found
    delete:
      tags:
        - Bank
      summary: Delete a bank branch by branchCode
      operationId: deleteBankBranch
      parameters:
        - name: branchCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Bank branch deleted
        '404':
          description: Bank branch not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BankBranchDto:
      type: object
      properties:
        bankCode:
          type: string
        bankName:
          type: string
        branchCode:
          type: string
        branchName:
          type: string
        swiftCode:
          type: string
        countryCode:
          type: string
        bankType:
          type: string
        status:
          type: string
        bankDescription:
          type: string
        branchDescription:
          type: string
        branchCity:
          type: string
        address:
          type: string
        zipCode:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
      required:
        - bankCode
        - branchCode
        - branchName
        - countryCode

    PageBankBranchDto:
      type: object
      description: Paged result wrapper for BankBranchDto.
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/BankBranchDto'

    Page:
      description: >-
        Page metadata. A page serializes as {content: [...], page: {size, number, totalElements, totalPages}}
        (Spring Data PagedModel).
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
          description: Zero-based page number
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    BankDto:
      type: object
      description: A bank (tenant), derived from its branches
      properties:
        bankCode:
          type: string
          example: "BANK_A"
        bankName:
          type: string
        countryCode:
          type: string
        bankType:
          type: string
