<!-- Global feedback while a navigation or foreground request is pending (LoadingIndicatorService) -->
<app-loading-bar/>
<router-outlet></router-outlet>
<!-- App-wide toasts, fed by ToastService (PrimeNG MessageService). Deferred to keep PrimeNG's toast/motion code
     out of the initial bundle; toasts are only raised after user interaction, well after the browser is idle. -->
@defer (on idle) {
  <p-toast position="top-right"/>
}
